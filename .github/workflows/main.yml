name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout code ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Setup Node + Yarn ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # ---- Install dependencies ----
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ---- Build ----
      - name: Build
        run: yarn build

      # ---- (Optional) Run Tests ----
      # - name: Test
      #   run: yarn test
